name: GUIX Regression Test

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  guix:
    # GitHub validates deployment permissions even when deployment is skipped.
    # The called test job narrows its own token and cannot deploy Pages.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    uses: eclipse-threadx/threadx/.github/workflows/regression_template.yml@b37cd4a81a1cb8c2ebefc438220ab7f009e13362
    with:
      install_script: ./scripts/ci_install.sh
      build_script: ./scripts/ci_build.sh
      test_script: ./scripts/ci_test.sh
      cmake_path: ./test/guix_test/cmake
      result_affix: GUIX
      coverage_name: merged
      coverage_thresholds: '98 100'
      skip_deploy: ${{ github.ref != 'refs/heads/master' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}
