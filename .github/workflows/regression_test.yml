name: GUIX Regression Test

on:
  workflow_dispatch:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

permissions:
  contents: read

jobs:
  guix:
    # GitHub validates deployment permissions even when deployment is skipped.
    # The called test job narrows its own token and cannot deploy Pages.
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      pages: write
      id-token: write
    uses: eclipse-threadx/threadx/.github/workflows/regression_template.yml@729959fed0fc380d68c2bdcb2b4d7a5430f5c21a
    with:
      install_script: ./scripts/ci_install.sh
      build_script: ./scripts/ci_build.sh
      test_script: ./scripts/ci_test.sh
      cmake_path: ./test/guix_test/cmake
      result_affix: GUIX
      # The install step here also builds default_build_coverage, because the
      # suite is staged across the three steps to fit their limits. The best run
      # on record took 8.2 of the default ten minutes and four have been lost at
      # the cap, so the packages and the checkout have been leaving too little
      # of it for the build. See issue #205 for moving that build out.
      install_timeout_minutes: 20
      # Five configurations are built here, and the best run on record took 11.8
      # of the default fifteen minutes. Six advisories added regression tests
      # this week, so that margin is closing rather than steady.
      build_timeout_minutes: 25
      coverage_name: merged
      coverage_thresholds: '98 100'
      skip_deploy: ${{ github.ref != 'refs/heads/master' || (github.event_name != 'push' && github.event_name != 'workflow_dispatch') }}
