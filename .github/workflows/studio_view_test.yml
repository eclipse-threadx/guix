# This is a basic workflow that is manually triggered

name: GUIX Studio View Test

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the master branch
on:
  workflow_dispatch:  
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
 
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job
  run_tests:
    permissions:
      contents: read
      issues: read
      checks: write
      pull-requests: write
      
    # The type of runner that the job will run on
    runs-on: windows-2019

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    - name: Check out the repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        submodules: true

    - name: Install
      run: scripts\install_studio_view.cmd

    - name: Test
      run: scripts\test_studio_view.cmd
    
    - name: Publish Test Results
      uses: EnricoMi/publish-unit-test-result-action/composite@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
      if: always()
      with:
        check_name: Test Results GUIX Studio View
        files: |
          test\guix_studio_test\test_view\studio_view_test_log.xml

    - name: Upload Test Results
      if: success() || failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: test_reports
        path: |
          test\guix_studio_test\test_view\studio_view_test_log.txt
          test\guix_studio_test\test_view\test_failures
        
